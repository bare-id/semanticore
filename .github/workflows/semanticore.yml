name: Semanticore

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  semanticore:
    runs-on: ubuntu-latest
    name: Semanticore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.*'
      - name: Semanticore
        run: go run . -changelog-max-lines 100
        env:
          SEMANTICORE_TOKEN: ${{secrets.SEMANTICORE_TOKEN}}
          GOTOOLCHAIN: auto
