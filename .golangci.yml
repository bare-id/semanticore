version: "2"

# Consolidates the individual tools previously run in CI:
#   go vet, staticcheck, misspell, ineffassign (linters)
#   gofmt, goimports (formatters)
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - misspell

formatters:
  enable:
    - gofmt
    - goimports
